[package]
name = "lix-schema-v1-public-qualification"
version = "0.0.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
blake3 = "1"
lix = { workspace = true }
lix_storage_rocksdb = { workspace = true }
lix_storage_slatedb = { workspace = true }
mimalloc = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
