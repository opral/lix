[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

[profile.ci-e2e]
inherits = "ci"

# The optimized latency job runs separately from other E2E workloads.
[profile.ci-latency]
inherits = "ci"
test-threads = 1
