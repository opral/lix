name: Build native packages for one-time npm bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'

jobs:
  build-js-sdk-arm64:
    uses: ./.github/workflows/build-js-sdk-arm64.yml
    with:
      ref: bf6b9a69fe9bee2c72a6bd6e86a71f03a4b8c7d9

  build-filesystem-native-packages:
    name: Build @lix-js/storage-filesystem native package (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-x64
            runner: ubicloud-standard-30-ubuntu-2404
          - suffix: darwin-arm64
            runner: blacksmith-12vcpu-macos-15
          - suffix: win32-x64
            runner: blacksmith-16vcpu-windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: bf6b9a69fe9bee2c72a6bd6e86a71f03a4b8c7d9

      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain

      - name: Install Linux native build dependencies
        if: startsWith(matrix.suffix, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang mold

      - name: Install LLVM build dependencies (Windows)
        if: matrix.suffix == 'win32-x64'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-js-sdk-${{ matrix.suffix }}

      - name: Restore compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          scope: sdk-release-${{ matrix.suffix }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/storage-filesystem/package-lock.json

      - name: Install filesystem storage dependencies
        working-directory: packages/storage-filesystem
        run: npm ci --legacy-peer-deps

      - name: Build filesystem storage native binary
        working-directory: packages/storage-filesystem
        run: npm run build:native

      - name: Upload Linux native binaries for SDK integration tests
        if: matrix.suffix == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-linux-test-binary
          path: packages/storage-filesystem/lix_storage_filesystem.node
          if-no-files-found: error

      - name: Test native binary on its target platform
        working-directory: packages/storage-filesystem
        run: node scripts/test-native-binary.cjs

      - name: Prepare filesystem storage native package
        working-directory: packages/storage-filesystem
        run: npm run prepare:native-package -- --suffix=${{ matrix.suffix }}

      - name: Upload filesystem storage native package
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-native-${{ matrix.suffix }}
          path: packages/storage-filesystem/native-packages/${{ matrix.suffix }}
          if-no-files-found: error

      - name: Upload native build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-native-timings-${{ matrix.suffix }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore


