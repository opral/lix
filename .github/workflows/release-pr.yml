name: Release PR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    name: Open ${{ matrix.target }} release PR
    strategy:
      fail-fast: false
      matrix:
        target: [lix, plugin_json, plugin_csv, plugin_markdown, plugin_text, plugin_excalidraw]
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    runs-on: ubicloud-standard-2-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leave ready release candidates frozen
        id: freeze
        uses: actions/github-script@v7
        with:
          script: |
            const { checkReleaseFreeze } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-candidate.mjs`);
            await checkReleaseFreeze({ github, context, core, target: process.env.RELEASE_TARGET });

      - name: Prepare release changes
        if: steps.freeze.outputs.frozen != 'true'
        id: prepare
        run: |
          output="$(node scripts/prepare-release.mjs --target "$RELEASE_TARGET")"
          echo "$output"
          version="$(printf '%s\n' "$output" | sed -n 's/^version=//p')"
          if [ -z "$version" ]; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$output" | sed -n '/^tag=/p; /^branch=/p' >> "$GITHUB_OUTPUT"

      - name: Validate prepared release metadata
        if: steps.prepare.outputs.has_release == 'true'
        run: |
          node scripts/validate-publish-surface.mjs
          node --test scripts/release.test.mjs
          git diff --check

      - name: Recheck candidate before writing
        if: steps.prepare.outputs.has_release == 'true'
        id: recheck
        uses: actions/github-script@v7
        with:
          script: |
            const { checkReleaseFreeze } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-candidate.mjs`);
            await checkReleaseFreeze({ github, context, core, target: process.env.RELEASE_TARGET });

      - name: Create or update release PR
        if: steps.prepare.outputs.has_release == 'true' && steps.recheck.outputs.frozen == 'false'
        id: release_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.prepare.outputs.branch }}
          delete-branch: true
          draft: true
          commit-message: Release ${{ steps.prepare.outputs.tag }}
          title: Release ${{ steps.prepare.outputs.tag }}
          body: |
            This PR was generated from `.changenotes/*` fragments.

            Mark this PR ready for review to freeze the candidate and run full CI.
            Merge only after the Release ready check passes for this commit.
            To include newer changes, return this PR to draft and manually run the Release PR workflow.
            Draft updates validate metadata; automated updates leave ready candidates untouched.

            This candidate releases `${{ matrix.target }}` as `${{ steps.prepare.outputs.tag }}`.
            Merging updates this target's version and changelog and enables its publisher.
            Other release targets retain their versions and pending change notes.

      - name: Close superseded release PRs for this target
        if: steps.release_pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          CURRENT_PR: ${{ steps.release_pr.outputs.pull-request-number }}
          TARGET_BRANCH: ${{ steps.prepare.outputs.branch }}
        with:
          script: |
            const target = process.env.RELEASE_TARGET;
            const prefix = target === 'lix' ? 'release/v' : `release/${target}/v`;
            const candidates = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', base: 'main', per_page: 100 });
            for (const pr of candidates) {
              if (!pr.draft || pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  !pr.head.ref.startsWith(prefix) || !/^\d+\.\d+\.\d+$/.test(pr.head.ref.slice(prefix.length)) ||
                  pr.head.ref === process.env.TARGET_BRANCH) continue;
              await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: 'closed' });
            }
