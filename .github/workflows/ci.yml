name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

defaults:
  run:
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#defaultsrun
    # https://linux.die.net/man/1/bash
    shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace -O nullglob -O dotglob {0}

jobs:
  changelog:
    name: Changelog
    runs-on: blacksmith-32vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate change fragments
        run: node scripts/validate-changes.mjs

  cargo:
    name: Cargo ${{ matrix.name }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clippy
            task: clippy
          - name: Test
            task: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set envs
        run: |
          grep -v "^#" << "EOF" >> "$GITHUB_ENV"
          CARGO_TERM_COLOR=always
          CARGO_INCREMENTAL=0
          # keep aligned with config.toml
          CARGO_PROFILE_DEV_DEBUG=0
          CARGO_PROFILE_TEST_DEBUG=0
          CARGO_PROFILE_RELEASE_DEBUG=0
          CARGO_PROFILE_BENCH_DEBUG=0
          CARGO_NET_RETRY=10
          RUSTUP_MAX_RETRIES=10
          GIT_AUTHOR_NAME=github-actions[bot]
          GIT_COMMITTER_NAME=github-actions[bot]
          GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          DEBIAN_FRONTEND=noninteractive
          BINSTALL_NO_CONFIRM=true
          EOF

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang mold

      - name: Restore compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable compiler cache
        run: |
          grep -v "^#" << "EOF" >> "$GITHUB_ENV"
          SCCACHE_GHA_ENABLED=true
          RUSTC_WRAPPER=sccache
          EOF

      - name: Lint Rust workspace
        if: matrix.task == 'clippy'
        run: cargo clippy --profile test --workspace --all-targets --all-features -- -D warnings

      - name: Compile Rust workspace tests
        if: matrix.task == 'test'
        run: cargo test --profile test --workspace --all-features --no-run

      - name: Run Rust workspace tests
        if: matrix.task == 'test'
        env:
          # The CRUD public-result parity test exercises every adapter in one
          # libtest worker and can exceed Rust's 2 MiB worker-stack default.
          RUST_MIN_STACK: 8388608
        run: cargo test --profile test --workspace --all-features

      - name: Verify the packaged plugin API contract
        if: matrix.task == 'test'
        run: |
          cargo package --locked -p lix_plugin_api
          cargo package --locked -p lix_plugin_api --list |
            rg '^wit/lix-plugin\.wit$'

      - name: Build a downstream Component plugin through the public API
        if: matrix.task == 'test'
        run: |
          rustup target add wasm32-wasip2
          cargo build --release -p plugin_csv --target wasm32-wasip2

  js-sdk-test:
    name: JS SDK ${{ matrix.name }} Test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native
            runtime: native
          - name: Browser
            runtime: browser

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set envs
        run: |
          grep -v "^#" << "EOF" >> "$GITHUB_ENV"
          CARGO_TERM_COLOR=always
          CARGO_INCREMENTAL=0
          # keep aligned with config.toml
          CARGO_PROFILE_DEV_DEBUG=0
          CARGO_PROFILE_TEST_DEBUG=0
          CARGO_PROFILE_RELEASE_DEBUG=0
          CARGO_PROFILE_BENCH_DEBUG=0
          CARGO_NET_RETRY=10
          RUSTUP_MAX_RETRIES=10
          LIX_NATIVE_PROFILE=test
          GIT_AUTHOR_NAME=github-actions[bot]
          GIT_COMMITTER_NAME=github-actions[bot]
          GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          DEBIAN_FRONTEND=noninteractive
          BINSTALL_NO_CONFIRM=true
          EOF

      - name: Install LLVM build dependencies
        if: matrix.runtime == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang mold

      - name: Install mold for WebAssembly host tooling
        if: matrix.runtime == 'browser'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Restore compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable compiler cache
        run: |
          grep -v "^#" << "EOF" >> "$GITHUB_ENV"
          SCCACHE_GHA_ENABLED=true
          RUSTC_WRAPPER=sccache
          EOF

      - name: Install plugin build target
        run: rustup target add wasm32-wasip2

      - name: Install browser WebAssembly build target
        if: matrix.runtime == 'browser'
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        if: matrix.runtime == 'browser'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/js-sdk/package-lock.json

      - name: Install JS SDK dependencies
        working-directory: packages/js-sdk
        run: npm ci

      - name: Install Chromium
        if: matrix.runtime == 'browser'
        working-directory: packages/js-sdk
        run: npx playwright install --with-deps chromium

      - name: Build native JS SDK
        if: matrix.runtime == 'native'
        working-directory: packages/js-sdk
        run: |
          npm run clean
          npm run build:native
          npm run build:ts
          npm run build:plugins

      - name: Run native JS SDK tests
        if: matrix.runtime == 'native'
        working-directory: packages/js-sdk
        run: npm exec -- vitest run

      - name: Build browser JS SDK
        if: matrix.runtime == 'browser'
        working-directory: packages/js-sdk
        run: npm run build:browser

      - name: Run browser JS SDK tests
        if: matrix.runtime == 'browser'
        working-directory: packages/js-sdk
        run: |
          npm run test:browser:built
          node ./scripts/test-packed-vite.js
