name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

defaults:
  run:
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#defaultsrun
    # https://linux.die.net/man/1/bash
    shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace -O nullglob -O dotglob {0}

jobs:
  changelog:
    name: Changelog
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-32vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate change fragments
        run: node scripts/validate-changes.mjs

      - name: Validate server protocol docs
        run: node scripts/validate-server-protocol-docs.mjs

  cargo-config:
    name: Cargo config (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: blacksmith-32vcpu-ubuntu-2404
          - name: macOS arm64
            runner: blacksmith-12vcpu-macos-15
          - name: Windows x64
            runner: blacksmith-16vcpu-windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cargo configuration and publish surface
        run: |
          node scripts/validate-publish-surface.mjs
          node --test scripts/release.test.mjs

  cargo:
    name: Cargo ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-32vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clippy
            task: clippy
          - name: Test
            task: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set envs
        run: |
          grep -v "^#" << "EOF" >> "$GITHUB_ENV"
          CARGO_TERM_COLOR=always
          CARGO_INCREMENTAL=0
          # keep aligned with config.toml
          CARGO_PROFILE_DEV_DEBUG=0
          CARGO_PROFILE_TEST_DEBUG=0
          CARGO_PROFILE_RELEASE_DEBUG=0
          CARGO_PROFILE_BENCH_DEBUG=0
          CARGO_NET_RETRY=10
          RUSTUP_MAX_RETRIES=10
          GIT_AUTHOR_NAME=github-actions[bot]
          GIT_COMMITTER_NAME=github-actions[bot]
          GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          DEBIAN_FRONTEND=noninteractive
          BINSTALL_NO_CONFIRM=true
          EOF

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang mold

      - name: Restore compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable compiler cache
        run: |
          grep -v "^#" << "EOF" >> "$GITHUB_ENV"
          SCCACHE_GHA_ENABLED=true
          RUSTC_WRAPPER=sccache
          EOF

      - name: Lint Rust workspace
        if: matrix.task == 'clippy'
        run: |
          cargo clippy --profile test --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path tooling/Cargo.toml --profile test --workspace --all-targets --all-features -- -D warnings

      # The one supported configuration nothing else here builds: `cfg(test)`
      # with `storage-benches` OFF, which is exactly what a plain
      # `cargo test -p lix` — the dev loop `packages/lix/AGENTS.md` documents —
      # compiles. Every other step has the feature on (`--all-features`), and a
      # `--no-default-features` check has no test targets at all, so a
      # `#[cfg(test)]` item that calls the feature-only `storage_bench` module
      # breaks `cargo test -p lix` while clippy, the full test matrix and the
      # `--all-features` build all stay green. Two such call sites had
      # accumulated in `gc.rs` before this step existed. `check` rather than
      # `test`: the matrix below already runs the tests, this only has to prove
      # the configuration compiles.
      - name: Check lix test targets with default features
        if: matrix.task == 'clippy'
        run: cargo check -p lix --tests

      - name: Verify stable Cargo can embed the local Rust SDK
        if: matrix.task == 'clippy'
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup run 1.93.0 cargo metadata --locked --format-version 1 --no-deps --manifest-path packages/lix/Cargo.toml
          downstream="$(mktemp -d)"
          rustup run 1.93.0 cargo init --bin --vcs none --name downstream_lix_sdk "$downstream"
          rustup run 1.93.0 cargo add --manifest-path "$downstream/Cargo.toml" --path "$PWD/packages/lix" --no-default-features lix
          # Run from the consumer crate. Invoking Cargo from the Lix checkout
          # would inherit this repository's nightly-only `.cargo/config.toml`,
          # which a real external path dependency does not inherit.
          (cd "$downstream" && rustup run 1.93.0 cargo check)

      # `--all-features` is deliberate: it is the only thing that compiles
      # feature-gated sources such as `packages/lix/src/storage_bench.rs`
      # (behind `lix/storage-benches`), where a stale assertion once survived
      # roughly ten pull requests because a plain `cargo test -p lix` never
      # built it.
      #
      # `lix_e2e` is excluded from that blanket only because its `tpch`
      # feature pulls `duckdb` with the `bundled` C++ build. No test needs it —
      # DuckDB is used solely by `[[bench]] tpch`, and `cargo test` never runs
      # benches — so it was minutes of CI spent compiling a dependency nothing
      # here executes. The crate is still compiled and tested below with every
      # feature its tests actually require.
      #
      # That feature list is exhaustive, not a guess: every `[[test]]` target in
      # `packages/e2e/Cargo.toml` declares `required-features` within
      # {sdk-tests, storage-benches, slatedb, rocksdb}, and `storage-benches`
      # implies `rocksdb`. `sdk-tests` covers the 11 targets folded in from the
      # former `lix_tests` crate; it turns on `lix/default_wasm_runtime`, which
      # those tests need and which the benches in that crate deliberately do not
      # build with. `root-replay-trace` carries no test of its own but gates
      # instrumentation sources, so it is listed to keep them compiling —
      # dropping it would recreate exactly the `storage_bench.rs` blind spot
      # described above.
      - name: Compile Rust workspace tests
        if: matrix.task == 'test'
        run: |
          cargo test --profile test --workspace --all-features --no-run
          cargo test --locked --manifest-path tooling/Cargo.toml --profile test --workspace --exclude lix_e2e --all-features --no-run
          cargo test --locked --manifest-path tooling/Cargo.toml --profile test -p lix_e2e --features sdk-tests,plugin-tests,server-protocol,storage-benches,slatedb,root-replay-trace --no-run

      - name: Run Rust workspace tests
        # Deliberately no stack-size override here. Production operations and
        # their tests must fit libtest's default worker stack, so the command a
        # developer runs by hand behaves like CI's.
        #
        # `--no-fail-fast` is required, not cosmetic. Without it cargo stops at
        # the first failing target and never runs the rest, so a single red
        # crate hides every later one. #1329 broke two tests; the second sat
        # invisible behind the first for hours because CI could only ever
        # report one, and it appeared in the logs as a compiled executable that
        # never ran.
        if: matrix.task == 'test'
        run: |
          cargo test --profile test --workspace --all-features --no-fail-fast
          cargo test --locked --manifest-path tooling/Cargo.toml --profile test --workspace --exclude lix_e2e --all-features --no-fail-fast
          cargo test --locked --manifest-path tooling/Cargo.toml --profile test -p lix_e2e --features sdk-tests,plugin-tests,server-protocol,storage-benches,slatedb,root-replay-trace --no-fail-fast

      # Examples are compiled by `--all-targets` but never executed, so the SQL
      # strings inside them are never checked. `checkpoints.rs` selected two
      # columns that do not exist on `lix_checkpoint` and clippy stayed green,
      # while the docs mirrored the same broken query. Running the example is
      # what makes its SQL a tested claim rather than a compiled string.
      # `--all-features` matches the compilation above so the artifacts are
      # reused.
      - name: Run Rust examples
        if: matrix.task == 'test'
        run: cargo run --profile test -p lix --all-features --example checkpoints

      # The e2e test compilation above already builds the real workspace plugin
      # artifacts. This one external fixture covers the distinct risk: whether
      # the packaged `lix` crate contains and exposes everything a plugin author
      # needs. `--no-verify` avoids compiling the native engine a second time;
      # compiling the extracted package for WASIp2 is the relevant verification.
      - name: Verify the packaged Lix plugin contract
        if: matrix.task == 'test'
        run: |
          rustup target add wasm32-wasip2
          cargo package --locked \
            -p lix-schema \
            -p lix \
            --no-verify
          package_archive="$(find target/package -maxdepth 1 -type f -name 'lix-[0-9]*.crate' | head -n 1)"
          schema_archive="$(find target/package -maxdepth 1 -type f -name 'lix-schema-*.crate' | head -n 1)"
          tar -tf "$package_archive" |
            rg '^[^/]+/wit/lix-plugin\.wit$'
          packaged_lix="$(mktemp -d)"
          packaged_schema="$(mktemp -d)"
          tar -xf "$package_archive" -C "$packaged_lix" --strip-components=1
          tar -xf "$schema_archive" -C "$packaged_schema" --strip-components=1
          downstream="$(mktemp -d)"
          cargo init --lib --name downstream_lix_plugin "$downstream"
          printf '\n[patch.crates-io]\nlix-schema = { path = "%s" }\n' \
            "$packaged_schema" \
            >> "$downstream/Cargo.toml"
          cargo add --manifest-path "$downstream/Cargo.toml" --path "$packaged_lix" lix
          cp packages/lix/examples/plugin_minimal.rs "$downstream/src/lib.rs"
          cargo build --manifest-path "$downstream/Cargo.toml" --target wasm32-wasip2

  js-sdk-test:
    name: JS SDK ${{ matrix.name }} Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-32vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native
            runtime: native
          - name: Browser
            runtime: browser

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set envs
        run: |
          grep -v "^#" << "EOF" >> "$GITHUB_ENV"
          CARGO_TERM_COLOR=always
          CARGO_INCREMENTAL=0
          # keep aligned with config.toml
          CARGO_PROFILE_DEV_DEBUG=0
          CARGO_PROFILE_TEST_DEBUG=0
          CARGO_PROFILE_RELEASE_DEBUG=0
          CARGO_PROFILE_BENCH_DEBUG=0
          CARGO_NET_RETRY=10
          RUSTUP_MAX_RETRIES=10
          LIX_NATIVE_PROFILE=test
          GIT_AUTHOR_NAME=github-actions[bot]
          GIT_COMMITTER_NAME=github-actions[bot]
          GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          DEBIAN_FRONTEND=noninteractive
          BINSTALL_NO_CONFIRM=true
          EOF

      - name: Install LLVM build dependencies
        if: matrix.runtime == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang mold

      - name: Install mold for WebAssembly host tooling
        if: matrix.runtime == 'browser'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Restore compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable compiler cache
        run: |
          grep -v "^#" << "EOF" >> "$GITHUB_ENV"
          SCCACHE_GHA_ENABLED=true
          RUSTC_WRAPPER=sccache
          EOF

      - name: Install plugin build target
        run: rustup target add wasm32-wasip2

      - name: Install WebAssembly build target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/js-sdk/package-lock.json
            packages/storage-filesystem/package-lock.json
            packages/storage-opfs/package-lock.json

      - name: Install JS SDK dependencies
        working-directory: packages/js-sdk
        run: npm ci

      - name: Install filesystem storage dependencies
        if: matrix.runtime == 'native'
        working-directory: packages/storage-filesystem
        run: npm ci --legacy-peer-deps

      - name: Install OPFS storage dependencies
        if: matrix.runtime == 'browser'
        working-directory: packages/storage-opfs
        run: npm ci

      - name: Install Chromium
        if: matrix.runtime == 'browser'
        working-directory: packages/js-sdk
        run: npx playwright install --with-deps chromium

      - name: Build native JS SDK
        if: matrix.runtime == 'native'
        working-directory: packages/js-sdk
        run: |
          npm run clean
          npm run build:native
          npm run build:wasm:dev
          npm run build:ts
          npm run build:plugins

      - name: Build and check filesystem storage package
        if: matrix.runtime == 'native'
        working-directory: packages/storage-filesystem
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Typecheck native JS SDK
        if: matrix.runtime == 'native'
        working-directory: packages/js-sdk
        run: npm run typecheck

      - name: Run native JS SDK tests
        if: matrix.runtime == 'native'
        working-directory: packages/js-sdk
        run: npm exec -- vitest run

      - name: Build browser JS SDK
        if: matrix.runtime == 'browser'
        working-directory: packages/js-sdk
        run: npm run build:browser

      - name: Build and check OPFS storage package
        if: matrix.runtime == 'browser'
        working-directory: packages/storage-opfs
        run: |
          npm run build
          npm run typecheck
          npm pack --dry-run --ignore-scripts

      - name: Run browser JS SDK tests
        if: matrix.runtime == 'browser'
        working-directory: packages/js-sdk
        run: |
          npm run test:browser:built
          node ./scripts/test-packed-vite.js

      - name: Run OPFS storage browser tests
        if: matrix.runtime == 'browser'
        working-directory: packages/storage-opfs
        run: |
          npm run test:browser:built
          npm run test:browser:production
          npm run benchmark
          npm run benchmark:multi-tab
