[package]
name = "plugin_markdown"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Markdown plugin for the fused Lix Wasm Component API v1"
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
chardetng = "1"
encoding_rs = "0.8"
lix_order_key.workspace = true
lix = { workspace = true, default-features = true }
markdown-syntax = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["std"] }
