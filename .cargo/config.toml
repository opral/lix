target-applies-to-host = false

[build]
target-dir = "target"

[alias]
# requires: cargo install cargo-bash
b = "bash export LIX_OLDPWD=$PWD && while ! [ -d \"$PWD/packages\" -a -d \"$PWD/plugins\" ]; do cd .. && [[ \"$PWD\" != \"/\" ]] || { echo \"not in lix repo\" && exit 1; }; done;"
lcheck-stable = "b lix_root=$PWD && rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open(\"Cargo.toml\",\"rb\"))[\"workspace\"][\"package\"][\"rust-version\"])') && tmpdir=$(mktemp -d) && trap 'rm -rf \"$tmpdir\"' EXIT && rustup run --install \"$rust_version\" cargo init --bin --vcs none --name lcheck-stable --quiet \"$tmpdir\" && cd \"$tmpdir\" && rustup run --install \"$rust_version\" cargo add --quiet lix_sdk --path \"$lix_root/packages/rs-sdk\" && rustup run --install \"$rust_version\" cargo build"
lclippy = "b NPROC=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.physicalcpu 2>/dev/null || echo 1); \"$CARGO\" metadata --format-version 1 --no-deps | jq -r '.packages[].manifest_path' | xargs \"-P$NPROC\" -n1 \"$CARGO\" clippy --all-features --all-targets --manifest-path && exit 0"

# assume we're always building inside flashtype/, so don't append duplicate rustflags
# check with: cargo -Z unstable-options config get --show-origin
[host]
# rustflags = [
# 	# https://blog.rust-lang.org/2023/11/09/parallel-rustc.html
# 	"-Zthreads=8",
# ]

# Cross-target builds still compile executable build scripts and proc macros
# for the Linux host. Cargo's host-config isolates those flags from the Wasm
# target while keeping host linking on mold.
[host.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-feature=+sse4.2,+pclmulqdq"]

[host.aarch64-unknown-linux-gnu]
rustflags = "-C link-arg=-fuse-ld=mold"

# keep host and generic-target rustflags in sync
[target.'cfg(all())']
# rustflags = [
# 	# https://blog.rust-lang.org/2023/11/09/parallel-rustc.html
# 	"-Zthreads=8",
# ]

# Use the parallel mold linker for native Linux binaries, build scripts, and
# proc macros. WebAssembly targets remain linker-neutral.
[target.'cfg(all(target_os = "linux", not(target_family = "wasm")))']
rustflags = "-C link-arg=-fuse-ld=mold"

# RocksDB picks its CRC32C implementation at C++ *compile* time
# (`rocksdb/util/crc32c.cc`: `#elif defined(__SSE4_2__) && defined(__PCLMUL__)`
# -> `crc32c_3way`). `librocksdb-sys/build.rs` only forwards `-msse4.2
# -mpclmul` to that compile when `CARGO_CFG_TARGET_FEATURE` already lists them,
# and the default `x86-64` baseline does not — so without this line every
# build gets `ExtendImpl<DefaultCRC32>`, the table-driven software fallback.
# A flat profile of a 640 MiB binary-CAS read spent 33.1% of its cycles there.
# SSE4.2 and PCLMULQDQ are Nehalem (2008) / Bulldozer (2011) and later; this
# raises lix's x86_64 floor to that, roughly `x86-64-v2`.
[target.'cfg(all(target_arch = "x86_64", not(target_family = "wasm")))']
rustflags = ["-C", "target-feature=+sse4.2,+pclmulqdq"]

[target.wasm32-unknown-unknown]
# rustflags = [
# 	"--cfg=getrandom_backend=\"wasm_js\"",
# ]
runner = "wasm-bindgen-test-runner"

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.test]
inherits = "dev"
debug = false
debug-assertions = true
opt-level = 0

[profile.test.build-override]
inherits = "dev"
debug = false
opt-level = 0
debug-assertions = true
overflow-checks = true

[profile.test.package."*"]
debug = false
debug-assertions = false
opt-level = 1
overflow-checks = false
[profile.test.package."log"]
debug-assertions = true

[profile.release]
trim-paths = true

[profile.bench]
debug = "line-tables-only"

[unstable]
bindeps = true
host-config = true
target-applies-to-host = true
trim-paths = true
