[package]
name = "lix-storage-rocksdb"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false

[lints]
workspace = true

[[test]]
name = "storage"
path = "tests/storage/main.rs"

[[test]]
name = "migration_profile"
path = "tests/migration_profile.rs"
required-features = ["storage-benches"]

[features]
# Forwards the engine's bench census so a scan-path counter can be read from a
# dedicated test target. Off by default: the counters are atomics on the scan
# hot path and must not be paid for in a shipping build.
storage-benches = ["lix/storage-benches"]

[dependencies]
lix = { workspace = true }

bytes = "1"
blake3 = "1"
rocksdb = { version = "0.24", default-features = false, features = ["bindgen-runtime", "zstd"] }
tempfile = "3"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
futures-lite = "2"
tokio = { version = "1", features = ["rt", "macros"] }
