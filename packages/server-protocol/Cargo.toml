[package]
name = "lix_server_protocol"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Canonical HTTP server protocol for independent Lix workspace sessions."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
axum = "0.8"
futures-core = "0.3"
getrandom = "0.3"
lix_sdk = { path = "../rs-sdk", version = "0.8.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt"] }
tower-http = { version = "0.6", features = ["compression-gzip", "decompression-gzip"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
lix_slatedb_storage = { workspace = true }
object_store = { version = "0.14", default-features = false }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber = "0.3"
zstd = "0.13"
