[package]
name = "lix-server-protocol"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Canonical HTTP server protocol for independent Lix workspace sessions."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autobenches = false

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
axum = "0.8"
futures-core = "0.3"
getrandom = "0.3"
lix = { workspace = true, default-features = false, features = ["default_wasm_runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-zstd", "decompression-gzip"] }
tracing = "0.1"

[target.'cfg(all(not(target_os = "windows"), any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
async-trait = "0.1"
base64 = "0.22"
criterion = { package = "codspeed-criterion-compat", version = "4" }
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
lix_collaboration_test_support = { path = "../collaboration-test-support" }
lix_storage_slatedb = { workspace = true }
lix_storage_rocksdb = { workspace = true }
object_store = { version = "0.14", default-features = false }
plugin_json = { path = "../../plugins/json", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber = "0.3"
zip = { version = "8", default-features = false }
zstd = "0.13"

[[bench]]
name = "request_blob_transport"
path = "benches/request_blob_transport.rs"
harness = false
