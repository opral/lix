[package]
name = "lix_storage_filesystem_node"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
path = "../js-bindings/lib.rs"

[features]
default = ["offline-migration"]
storage-bridge-bench = []
offline-migration = ["lix/offline-migration"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
futures-lite = "2"
async-channel = "2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
lix = { workspace = true, default-features = false }
lix_storage_filesystem = { workspace = true }
napi = { version = "3.9.0", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3.5.6"
tokio = { version = "1", features = ["rt", "sync"] }
mimalloc.workspace = true
