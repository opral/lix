[package]
name = "lix_e2e"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobenches = false
autotests = false
autoexamples = false

[lints]
workspace = true

# NOTE: `rocksdb`, `slatedb` and `storage-benches` look like gates on
# dependencies this crate always needs, but they are not: 116 `#[cfg(feature =
# ...)]` sites across 12 source files in this crate read them, including a
# `StorageProfile::SlateDB` enum variant. Deleting the features silently
# compiles that code out -- measured, it produced 160 `unexpected cfg condition
# value` warnings and 2 hard errors where the variant vanished and its use sites
# did not. They stay until someone edits those 116 sites as a separate change.
[features]
default = ["rocksdb"]
rocksdb = ["dep:lix_storage_rocksdb"]
slatedb = ["dep:lix_storage_slatedb", "dep:object_store", "dep:slatedb", "dep:ulid"]
storage-benches = ["lix/storage-benches", "rocksdb", "lix_storage_rocksdb/storage-benches"]
root-replay-trace = ["lix/root-replay-trace", "storage-benches"]
server-protocol = ["lix/server-protocol"]
tpch = ["dep:duckdb", "dep:tpchgen"]
# Turns on `lix/default_wasm_runtime` for the SDK tests folded in from the
# former `lix_tests` crate, which ran with it enabled. It is deliberately not
# unconditional: with that feature on, `handle.rs::new_engine` gives every Lix
# opened without an explicit runtime a Wasmtime runtime, which would change what
# every benchmark in this crate measures.
sdk-tests = ["lix/default_wasm_runtime"]
# Compiled-plugin qualifications that need the engine's maintenance inspection
# hooks but no external storage adapter.
plugin-tests = ["lix/default_wasm_runtime", "lix/storage-benches"]
# Opt-in profiling build that routes Rust allocations through libc so tools
# such as heaptrack can attribute transient allocation churn to call stacks.
# Normal tracked-CRUD builds wrap mimalloc with byte accounting so latency
# remains comparable with the existing benchmark. This feature removes that
# allocator entirely so heap profilers and RSS controls use libc directly.
system-allocation-profiler = []

[dependencies]
lix = { workspace = true }
lix_storage_filesystem = { workspace = true }
lix_storage_rocksdb = { workspace = true, optional = true }
lix_storage_slatedb = { workspace = true, optional = true }
object_store = { version = "0.14", default-features = false, features = ["fs"], optional = true }
slatedb = { version = "0.14.1", default-features = false, features = ["moka", "zstd"], optional = true }
ulid = { version = "1.2.1", optional = true }
duckdb = { version = "=1.10505.0", features = ["bundled"], optional = true }
tpchgen = { version = "=3.0.0", optional = true }
zstd = "0.13"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
ahash = "0.8"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
fastcdc = "3"
criterion = { package = "codspeed-criterion-compat", version = "4" }
datafusion = { version = "53.0.0", default-features = false, features = ["sql"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lix_collaboration_test_support = { path = "../collaboration-test-support" }
sha2 = "0.10"
libc = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["std"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "8", default-features = false }

# Plugin components, built for wasm32-wasip2 and handed to the tests through
# CARGO_CDYLIB_FILE_*. Cargo forbids optional dev-dependencies, so these are
# unconditional; they cost build time on a bench-only invocation but cannot
# change what a bench measures, since nothing loads them without `sdk-tests`.
plugin_csv = { path = "../../plugins/csv", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
plugin_excalidraw = { path = "../../plugins/excalidraw", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
plugin_json = { path = "../../plugins/json", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
plugin_markdown = { path = "../../plugins/markdown", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
plugin_text = { path = "../../plugins/text", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
http = "1"
http-body-util = "0.1"

