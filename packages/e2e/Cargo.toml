[package]
name = "lix_benchmarks"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobenches = false
autotests = false

[lints]
workspace = true

[features]
default = ["rocksdb"]
rocksdb = ["dep:lix_storage_rocksdb"]
slatedb = ["dep:lix_storage_slatedb", "dep:object_store", "dep:slatedb", "dep:ulid"]
storage-benches = ["lix/storage-benches", "rocksdb"]
root-replay-trace = ["lix/root-replay-trace", "storage-benches"]
tpch = ["dep:duckdb", "dep:tpchgen"]
# Opt-in profiling build that routes Rust allocations through libc so tools
# such as heaptrack can attribute transient allocation churn to call stacks.
# Normal tracked-CRUD builds wrap mimalloc with byte accounting so latency
# remains comparable with the existing benchmark. This feature removes that
# allocator entirely so heap profilers and RSS controls use libc directly.
system-allocation-profiler = []

[dependencies]
lix = { workspace = true }
lix_storage_rocksdb = { workspace = true, optional = true }
lix_storage_slatedb = { workspace = true, optional = true }
object_store = { version = "0.14", default-features = false, features = ["fs"], optional = true }
slatedb = { version = "0.14.1", default-features = false, features = ["moka", "zstd"], optional = true }
ulid = { version = "1.2.1", optional = true }
duckdb = { version = "=1.10505.0", features = ["bundled"], optional = true }
tpchgen = { version = "=3.0.0", optional = true }
zstd = "0.13"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
ahash = "0.8"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
fastcdc = "3"
criterion = { package = "codspeed-criterion-compat", version = "4" }
datafusion = { version = "53.0.0", default-features = false, features = ["sql"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
libc = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["std"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

