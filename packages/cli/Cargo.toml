[package]
name = "lix_cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools", "artificial-intelligence", "filesystem"]
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "lix"
path = "src/main.rs"

[dependencies]
lix_sdk = { workspace = true }
lix_rocksdb_storage = { workspace = true }
plugin_git_text_v2 = { path = "../../plugins/text-v2", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }

clap = { version = "4.5.31", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
base64 = "0.22"
bytes = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
zip = { version = "8", default-features = false }
