[package]
name = "lix_engine_benchmarks"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobenches = false
autotests = false

[lints]
workspace = true

[features]
default = ["rocksdb"]
rocksdb = ["dep:lix_rocksdb_storage"]
sqlite = ["dep:lix_sqlite_storage", "dep:rusqlite"]
slatedb = ["dep:lix_slatedb_storage", "dep:object_store"]
storage-benches = ["lix_engine/storage-benches", "rocksdb", "sqlite"]

[dependencies]
lix_engine = { workspace = true }
lix_rocksdb_storage = { workspace = true, optional = true }
lix_slatedb_storage = { workspace = true, optional = true }
lix_sqlite_storage = { workspace = true, optional = true }
object_store = { version = "0.14", default-features = false, optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
ahash = "0.8"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
criterion = { package = "codspeed-criterion-compat", version = "*" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[[test]]
name = "exact_file_read_benchmark"
path = "tests/exact_file_read_benchmark.rs"
required-features = ["rocksdb"]

[[test]]
name = "tracked_state_crud_public_result"
path = "tests/tracked_state_crud_public_result.rs"
required-features = ["storage-benches"]

[[bench]]
name = "storage_v2"
path = "benches/storage_v2.rs"
harness = false
required-features = ["storage-benches"]

