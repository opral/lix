[package]
name = "forktree-stage2-multimedia-oracle"
version = "0.0.0"
edition = "2024"
publish = false

[[test]]
name = "stage2_multimedia_acceptance"
path = "stage2_multimedia_acceptance.rs"

[dependencies]
async-trait = "0.1"
blake3 = "1"
bytes = "1"
mimalloc = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
lix = { path = "/root/repos/lix-forktree-stage2-runnable/packages/lix", features = ["storage-benches"] }
lix_storage_rocksdb = { path = "/root/repos/lix-forktree-stage2-runnable/packages/rocksdb-storage" }
lix_storage_slatedb = { path = "/root/repos/lix-forktree-stage2-runnable/packages/slatedb-storage" }

