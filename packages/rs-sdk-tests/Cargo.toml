[package]
name = "lix_sdk_tests"
version = "0.9.0"
edition = "2024"
description = "Integration tests and benchmarks for the Lix Rust SDK."
license = "MIT"
homepage = "https://lix.dev"
repository = "https://github.com/opral/lix"
rust-version = "1.93"
publish = false

[dependencies]
lix_sdk = { path = "../rs-sdk", version = "0.9.0", default-features = false, features = ["default_wasm_runtime", "local_filesystem", "sqlite"] }

[dev-dependencies]
lix_engine = { path = "../engine", version = "0.9.0", features = ["storage-benches"] }
lix_rocksdb_storage = { path = "../rocksdb-storage", version = "0.9.0" }
plugin_csv = { path = "../../plugins/csv", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
plugin_excalidraw = { path = "../../plugins/excalidraw", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
plugin_markdown = { path = "../../plugins/markdown", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
plugin_json = { path = "../../plugins/json", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }
plugin_git_text = { path = "../../plugins/text", lib = true, artifact = "cdylib", target = "wasm32-wasip2" }

async-trait = "0.1"
base64 = "0.22"
bytes = "1"
criterion = { package = "codspeed-criterion-compat", version = "4" }
rand = { version = "0.9", features = ["small_rng"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["std"] }
wasmtime = { version = "45", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "45", default-features = false, features = ["p2"] }
zip = { version = "8", default-features = false }
