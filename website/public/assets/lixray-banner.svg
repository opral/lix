    <text x="472" y="109.5" fill="#0969DA">JM</text>
    <circle cx="496" cy="106" r="10" fill="#FFF1E5" stroke="#FFD8B5"/>
    <text x="496" y="109.5" fill="#BC4C00">AL</text>
    <circle cx="520" cy="106" r="10" fill="#EBF0FF" stroke="#D0DBFF"/>
    <text x="520" y="109.5" fill="#4056C9">+6</text>
