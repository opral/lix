  <!-- browser window -->
  <path d="M90 40 A10 10 0 0 1 100 30 H580 A10 10 0 0 1 590 40 V220 H90 Z" fill="#FFFFFF"/>
  <path d="M90 40 A10 10 0 0 1 100 30 H580 A10 10 0 0 1 590 40 V62 H90 Z" fill="#FDFCFA"/>
  <line x1="90" y1="62" x2="590" y2="62" stroke="#EDEBE4" stroke-width="1"/>

