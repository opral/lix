  <g transform="translate(28, 242) scale(0.22)">
    <path fill="#E8590C" fill-rule="evenodd" d="M32 8 H68 A24 24 0 0 1 92 32 V68 A24 24 0 0 1 68 92 H32 A24 24 0 0 1 8 68 V32 A24 24 0 0 1 32 8 Z M31 72 H69 Q74 72 74 67 V34 Q74 27 69 33 L56 44.5 L26 23.8 A2.75 2.75 0 0 0 23.8 26 L49 51 L31 67 Q26 72 31 72 Z M55.5 60 a4.5 4.5 0 1 0 9 0 a4.5 4.5 0 1 0 -9 0 Z"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif">
    <text x="58" y="259" font-size="19" font-weight="700" letter-spacing="-0.3" fill="#15171B">LixRay</text>
    <text x="28" y="288" font-size="14" fill="#6B7076">One repo your team and your agents share.</text>
    <text x="28" y="308" font-size="14" fill="#6B7076">Any file type, every change tracked.</text>
    <rect x="522" y="256" width="130" height="42" rx="8" fill="#07B6D5"/>
    <text x="587" y="282" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Try LixRay →</text>
  </g>

  <!-- card border -->
  <rect x="0.75" y="0.75" width="678.5" height="332.5" rx="12" fill="none" stroke="#E6E4DD" stroke-width="1.5"/>
