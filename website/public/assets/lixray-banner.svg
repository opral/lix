  <text x="112" y="86" font-size="9" letter-spacing="0.9" fill="#8A8F96">REPOSITORY</text>

  <g transform="translate(112, 101)"><path d="M1 2.5 C1 1.7 1.6 1 2.4 1 H4.8 L6.2 2.6 H11.6 C12.4 2.6 13 3.3 13 4.1 V9.5 C13 10.3 12.4 11 11.6 11 H2.4 C1.6 11 1 10.3 1 9.5 Z" fill="#54AEFF"/></g>
  <text x="131" y="110" font-size="10.5" fill="#15171B">sales/<tspan dx="8" fill="#8A8F96">playbook.md · icp.md · leads.csv</tspan></text>

  <g transform="translate(112, 127)"><path d="M1 2.5 C1 1.7 1.6 1 2.4 1 H4.8 L6.2 2.6 H11.6 C12.4 2.6 13 3.3 13 4.1 V9.5 C13 10.3 12.4 11 11.6 11 H2.4 C1.6 11 1 10.3 1 9.5 Z" fill="#54AEFF"/></g>
  <text x="131" y="136" font-size="10.5" fill="#15171B">brand/<tspan dx="8" fill="#8A8F96">logo.png · deck.pdf · launch.mp4</tspan></text>

  <g transform="translate(112, 153)"><path d="M1 2.5 C1 1.7 1.6 1 2.4 1 H4.8 L6.2 2.6 H11.6 C12.4 2.6 13 3.3 13 4.1 V9.5 C13 10.3 12.4 11 11.6 11 H2.4 C1.6 11 1 10.3 1 9.5 Z" fill="#54AEFF"/></g>
  <text x="131" y="162" font-size="10.5" fill="#15171B">skills/<tspan dx="8" fill="#8A8F96">call-prep · research</tspan></text>

  <g transform="translate(112, 179)"><path d="M1 2.5 C1 1.7 1.6 1 2.4 1 H4.8 L6.2 2.6 H11.6 C12.4 2.6 13 3.3 13 4.1 V9.5 C13 10.3 12.4 11 11.6 11 H2.4 C1.6 11 1 10.3 1 9.5 Z" fill="#54AEFF"/></g>
  <text x="131" y="188" font-size="10.5" fill="#15171B">automations/<tspan dx="8" fill="#8A8F96">crm-sync.py · weekly-report.js</tspan></text>

  <!-- shared-with panel -->
  <line x1="440" y1="62" x2="440" y2="220" stroke="#EDEBE4" stroke-width="1"/>
  <text x="462" y="86" font-size="9" letter-spacing="0.9" fill="#8A8F96">SHARED WITH</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
