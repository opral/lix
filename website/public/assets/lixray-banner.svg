<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" role="img" aria-label="LixRay: one repo your team and your agents share. Any file type, every change tracked." font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">
  <!-- card background -->
  <rect x="0.75" y="0.75" width="678.5" height="332.5" rx="12" fill="#FFFFFF"/>

  <!-- preview area -->
