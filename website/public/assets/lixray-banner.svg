  <circle cx="106" cy="46" r="4.5" fill="#E0DED6"/>
  <circle cx="120" cy="46" r="4.5" fill="#E0DED6"/>
  <circle cx="134" cy="46" r="4.5" fill="#E0DED6"/>
  <rect x="249" y="38" width="182" height="17" rx="5" fill="#F3F1EA"/>
