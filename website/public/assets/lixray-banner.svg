  <!-- window border, drawn on top so the frame stays crisp -->
  <path d="M90 220 V40 A10 10 0 0 1 100 30 H580 A10 10 0 0 1 590 40 V220" fill="none" stroke="#E6E4DD" stroke-width="1"/>
  <line x1="1.5" y1="220" x2="678.5" y2="220" stroke="#E6E4DD" stroke-width="1"/>

