<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Diagram: client A and client B each hold the same project files on their own filesystem and sync them with a Lix server." font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0.75" y="0.75" width="678.5" height="328.5" rx="10" fill="#F7F6F1" stroke="#EDEBE4" stroke-width="1.5"/>
  <g transform="translate(20, 20)">

    <!-- client A -->
    <rect x="0" y="0" width="190" height="135" rx="10" fill="#FFFFFF" stroke="#E6E4DD"/>
    <path d="M0 10 A10 10 0 0 1 10 0 H180 A10 10 0 0 1 190 10 V30 H0 Z" fill="#FDFCFA"/>
    <line x1="0" y1="30" x2="190" y2="30" stroke="#EDEBE4" stroke-width="1"/>
    <circle cx="16" cy="15" r="3.5" fill="#E0DED6"/>
    <circle cx="28" cy="15" r="3.5" fill="#E0DED6"/>
    <circle cx="40" cy="15" r="3.5" fill="#E0DED6"/>
    <text x="103" y="19" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#15171B">CLIENT A</text>
    <path transform="translate(20, 46)" d="M0 1.9 C0 1.2 0.5 0.7 1.2 0.7 H4.2 L5.4 2 H10.8 C11.5 2 12 2.5 12 3.2 V8.8 C12 9.5 11.5 10 10.8 10 H1.2 C0.5 10 0 9.5 0 8.8 Z" fill="#54AEFF"/>
    <text x="40" y="55" font-size="10.5" fill="#3D4046">project/</text>
    <text x="40" y="77" font-size="10.5" fill="#3D4046">timeline.json</text>
    <text x="40" y="99" font-size="10.5" fill="#0891AC">notes.md</text>
    <text x="40" y="121" font-size="10.5" fill="#3D4046">render.mov</text>

    <!-- client B -->
    <rect x="0" y="155" width="190" height="135" rx="10" fill="#FFFFFF" stroke="#E6E4DD"/>
    <path d="M0 165 A10 10 0 0 1 10 155 H180 A10 10 0 0 1 190 165 V185 H0 Z" fill="#FDFCFA"/>
    <line x1="0" y1="185" x2="190" y2="185" stroke="#EDEBE4" stroke-width="1"/>
    <circle cx="16" cy="170" r="3.5" fill="#E0DED6"/>
    <circle cx="28" cy="170" r="3.5" fill="#E0DED6"/>
    <circle cx="40" cy="170" r="3.5" fill="#E0DED6"/>
    <text x="103" y="174" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#15171B">CLIENT B</text>
    <path transform="translate(20, 201)" d="M0 1.9 C0 1.2 0.5 0.7 1.2 0.7 H4.2 L5.4 2 H10.8 C11.5 2 12 2.5 12 3.2 V8.8 C12 9.5 11.5 10 10.8 10 H1.2 C0.5 10 0 9.5 0 8.8 Z" fill="#54AEFF"/>
    <text x="40" y="210" font-size="10.5" fill="#3D4046">project/</text>
    <text x="40" y="232" font-size="10.5" fill="#3D4046">timeline.json</text>
    <text x="40" y="254" font-size="10.5" fill="#0891AC">notes.md</text>
    <text x="40" y="276" font-size="10.5" fill="#3D4046">render.mov</text>

    <!-- sync -->
    <path d="M190 67 C246 67 246 145 300 145" fill="none" stroke="#C9C7BF" stroke-width="1.2"/>
    <path d="M190 222 C246 222 246 145 300 145" fill="none" stroke="#C9C7BF" stroke-width="1.2"/>
    <line x1="348" y1="145" x2="378" y2="145" stroke="#C9C7BF" stroke-width="1.2"/>
    <rect x="300" y="135" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#B9E5EF"/>
    <text x="324" y="148.5" text-anchor="middle" font-size="10" fill="#0891AC">sync</text>

    <!-- lix server -->
    <rect x="378" y="70" width="240" height="150" rx="10" fill="rgba(7,182,213,0.05)" stroke="#07B6D5" stroke-width="1.5"/>
    <path d="M378 80 A10 10 0 0 1 388 70 H608 A10 10 0 0 1 618 80 V100 H378 Z" fill="rgba(7,182,213,0.08)"/>
    <line x1="378" y1="100" x2="618" y2="100" stroke="#B9E5EF" stroke-width="1"/>
    <text x="498" y="89" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#0891AC">LIX SERVER</text>
    <path transform="translate(400, 116)" d="M0 1.9 C0 1.2 0.5 0.7 1.2 0.7 H4.2 L5.4 2 H10.8 C11.5 2 12 2.5 12 3.2 V8.8 C12 9.5 11.5 10 10.8 10 H1.2 C0.5 10 0 9.5 0 8.8 Z" fill="#54AEFF"/>
    <text x="420" y="125" font-size="10.5" fill="#3D4046">project/</text>
    <text x="420" y="147" font-size="10.5" fill="#3D4046">timeline.json</text>
    <text x="420" y="169" font-size="10.5" fill="#0891AC">notes.md</text>
    <text x="420" y="191" font-size="10.5" fill="#3D4046">render.mov</text>

  </g>
</svg>
