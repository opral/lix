<svg viewBox="0 0 880 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your app uses SQL and existing tools use files; both work on the same Lix repository" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0.75" y="0.75" width="878.5" height="242.5" rx="10" fill="#F7F6F1" stroke="#EDEBE4" stroke-width="1.5"/>

  <!-- your app -->
  <rect x="150" y="36" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.5"/>
  <text x="270" y="63" font-size="12" letter-spacing="1.2" fill="#15171B" text-anchor="middle">YOUR APP</text>
  <text x="270" y="84" font-size="12" fill="#6B7076" text-anchor="middle">queries and transactions</text>

  <!-- existing tools -->
  <rect x="490" y="36" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.5"/>
  <text x="610" y="63" font-size="12" letter-spacing="1.2" fill="#15171B" text-anchor="middle">EXISTING TOOLS</text>
  <text x="610" y="84" font-size="12" fill="#6B7076" text-anchor="middle">editors, scripts, agents</text>

  <!-- connectors -->
  <line x1="270" y1="100" x2="270" y2="150" stroke="#07B6D5" stroke-width="1.5"/>
  <text x="282" y="130" font-size="11.5" fill="#0891AC">SQL</text>
  <line x1="610" y1="100" x2="610" y2="150" stroke="#C9C7BF" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="622" y="130" font-size="11.5" fill="#6B7076">files</text>

  <!-- lix -->
  <rect x="150" y="150" width="580" height="58" rx="8" fill="rgba(7,182,213,0.08)" stroke="#07B6D5" stroke-width="1.5"/>
  <text x="440" y="176" font-size="12" letter-spacing="1.2" fill="#0891AC" text-anchor="middle">LIX</text>
  <text x="440" y="196" font-size="12" fill="#6B7076" text-anchor="middle">history · branches · merge · review</text>
</svg>
