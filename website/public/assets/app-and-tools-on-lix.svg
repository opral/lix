<svg viewBox="0 0 880 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your app uses SQL and existing tools use files; both work on the same Lix repository" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0.75" y="0.75" width="878.5" height="218.5" rx="10" fill="#F7F6F1" stroke="#EDEBE4" stroke-width="1.5"/>

  <!-- your app -->
  <rect x="180" y="40" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.5"/>
  <text x="290" y="70" font-size="12" letter-spacing="1.2" fill="#15171B" text-anchor="middle">YOUR APP</text>

  <!-- existing tools -->
  <rect x="480" y="40" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.5"/>
  <text x="590" y="70" font-size="12" letter-spacing="1.2" fill="#15171B" text-anchor="middle">EXISTING TOOLS</text>

  <!-- connectors -->
  <line x1="290" y1="90" x2="290" y2="132" stroke="#07B6D5" stroke-width="1.5"/>
  <text x="302" y="116" font-size="11.5" fill="#0891AC">SQL</text>
  <line x1="590" y1="90" x2="590" y2="132" stroke="#C9C7BF" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="602" y="116" font-size="11.5" fill="#6B7076">files</text>

  <!-- lix -->
  <rect x="180" y="132" width="520" height="52" rx="8" fill="rgba(7,182,213,0.08)" stroke="#07B6D5" stroke-width="1.5"/>
  <text x="440" y="163" font-size="12" letter-spacing="1.2" fill="#0891AC" text-anchor="middle">LIX</text>
</svg>
