<svg viewBox="0 0 880 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An agent works on its own branch while main stays stable; the branch is merged or discarded" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0.75" y="0.75" width="878.5" height="228.5" rx="10" fill="#F7F6F1" stroke="#EDEBE4" stroke-width="1.5"/>

  <!-- main rail -->
  <line x1="60" y1="150" x2="820" y2="150" stroke="#8A8F96" stroke-width="1.5"/>
  <circle cx="140" cy="150" r="4" fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.5"/>
  <circle cx="260" cy="150" r="4" fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.5"/>
  <circle cx="740" cy="150" r="4" fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.5"/>
  <text x="62" y="182" font-size="10.5" letter-spacing="1.2" fill="#15171B">MAIN</text>
  <text x="62" y="200" font-size="12" fill="#6B7076">stays stable</text>

  <!-- agent branch -->
  <path d="M260 150 C300 150 300 80 340 80 H560" fill="none" stroke="#07B6D5" stroke-width="1.5"/>
  <circle cx="390" cy="80" r="4" fill="#FFFFFF" stroke="#07B6D5" stroke-width="1.5"/>
  <circle cx="450" cy="80" r="4" fill="#FFFFFF" stroke="#07B6D5" stroke-width="1.5"/>
  <text x="340" y="44" font-size="10.5" letter-spacing="1.2" fill="#0891AC">AGENT BRANCH</text>
  <text x="340" y="61" font-size="12" fill="#6B7076">edits files and SQL rows</text>
  <rect x="487" y="66" width="60" height="28" rx="6" fill="rgba(7,182,213,0.14)" stroke="#07B6D5" stroke-width="1.5"/>
  <text x="517" y="84" font-size="12" fill="#0891AC" text-anchor="middle">agent</text>

  <!-- merge path -->
  <path d="M560 80 C600 80 600 150 636 150" fill="none" stroke="#07B6D5" stroke-width="1.5"/>
  <path d="M630 143.5 L640 150 L630 156.5" fill="none" stroke="#07B6D5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="614" y="124" font-size="10.5" letter-spacing="1.2" fill="#0891AC">MERGE</text>

  <!-- discard path -->
  <line x1="560" y1="80" x2="648" y2="80" stroke="#C9C7BF" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="655" y1="74" x2="667" y2="86" stroke="#8A8F96" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="667" y1="74" x2="655" y2="86" stroke="#8A8F96" stroke-width="1.5" stroke-linecap="round"/>
  <text x="678" y="84" font-size="10.5" letter-spacing="1.2" fill="#8A8F96">OR DISCARD</text>
</svg>
