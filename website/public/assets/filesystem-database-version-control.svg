<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 218" role="img" aria-label="Lix combines files of any format, SQL tables, version control, and an embeddable library" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0.75" y="0.75" width="878.5" height="216.5" rx="10" fill="#F7F6F1" stroke="#EDEBE4" stroke-width="1.5"/>
  <g fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.4">
    <rect x="24" y="35" width="196" height="150" rx="8"/>
    <rect x="236" y="35" width="196" height="150" rx="8"/>
    <rect x="448" y="35" width="196" height="150" rx="8"/>
    <rect x="660" y="35" width="196" height="150" rx="8"/>
  </g>
  <g fill="#0891AC" font-size="12" font-weight="700" text-anchor="middle">
    <text x="122" y="79">FILES</text>
    <text x="334" y="79">SQL TABLES</text>
    <text x="546" y="79">VERSION CONTROL</text>
    <text x="758" y="79">EMBEDDED</text>
  </g>
  <g fill="#3D4046" font-size="11.5" text-anchor="middle">
    <text x="122" y="111">Any format, including</text><text x="122" y="130">large media and CAD</text>
    <text x="334" y="111">CRM, logs, and</text><text x="334" y="130">application data</text>
    <text x="546" y="111">Branch, diff, merge,</text><text x="546" y="130">and roll back both</text>
    <text x="758" y="111">Runs in-process</text><text x="758" y="130">inside your app</text>
  </g>
  <g fill="#8A8F96" font-size="16" text-anchor="middle"><text x="228" y="116">+</text><text x="440" y="116">+</text><text x="652" y="116">+</text></g>
</svg>
