<svg viewBox="0 0 880 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A plugin maps the file /orders.csv to SQL rows with row, field, and value columns" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0.75" y="0.75" width="878.5" height="198.5" rx="10" fill="#F7F6F1" stroke="#EDEBE4" stroke-width="1.5"/>

  <!-- the file on disk -->
  <text x="48" y="56" font-size="10.5" letter-spacing="1.2" fill="#8A8F96">THE FILE ON DISK</text>
  <rect x="48" y="94" width="182" height="48" rx="8" fill="#FFFFFF" stroke="#E6E4DD" stroke-width="1.5"/>
  <g transform="translate(66,106)">
    <path d="M3 1 H13 L17 5 V23 H3 Z" fill="#FFFFFF" stroke="#8A8F96" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M13 1 V5 H17" fill="none" stroke="#8A8F96" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <text x="94" y="123" font-size="13" fill="#15171B">/orders.csv</text>

  <!-- plugin arrow -->
  <text x="306" y="100" font-size="11.5" fill="#0891AC" text-anchor="middle">plugin</text>
  <line x1="256" y1="118" x2="348" y2="118" stroke="#8A8F96" stroke-width="1.4"/>
  <path d="M348 113.5 L357 118 L348 122.5" fill="none" stroke="#8A8F96" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- the same file as sql rows -->
  <text x="400" y="56" font-size="10.5" letter-spacing="1.2" fill="#8A8F96">THE SAME FILE AS SQL ROWS</text>
  <rect x="400" y="68" width="340" height="100" rx="8" fill="#FFFFFF" stroke="#E6E4DD" stroke-width="1.5"/>
  <text x="418" y="90" font-size="10.5" letter-spacing="0.8" fill="#8A8F96">ROW</text>
  <text x="540" y="90" font-size="10.5" letter-spacing="0.8" fill="#8A8F96">FIELD</text>
  <text x="632" y="90" font-size="10.5" letter-spacing="0.8" fill="#8A8F96">VALUE</text>
  <line x1="400.75" y1="100" x2="739.25" y2="100" stroke="#EDEBE4" stroke-width="1"/>
  <text x="418" y="122" font-size="12.5" fill="#3D4046">row 1001</text>
  <text x="540" y="122" font-size="12.5" fill="#3D4046">status</text>
  <text x="632" y="122" font-size="12.5" fill="#3D4046">shipped</text>
  <line x1="400.75" y1="134" x2="739.25" y2="134" stroke="#EDEBE4" stroke-width="1"/>
  <rect x="624" y="140" width="72" height="24" rx="4" fill="rgba(7,182,213,0.08)"/>
  <text x="418" y="156" font-size="12.5" fill="#3D4046">row 1002</text>
  <text x="540" y="156" font-size="12.5" fill="#3D4046">status</text>
  <text x="632" y="156" font-size="12.5" fill="#0891AC">pending</text>
</svg>
